server {
    server_name sable.nicolasboyer.com;

    root /var/www/sable;
    index index.html;

    access_log /var/log/nginx/sable_access.log;
    error_log  /var/log/nginx/sable_error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://127.0.0.1:8766/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 100s;
        proxy_read_timeout 100s;
    }

    listen 443 ssl; # managed by Certbot
    listen 8443 ssl; # ajout manuel (coherent avec les autres vhosts)
    listen [::]:8443 ssl; # ajout manuel (coherent avec les autres vhosts)
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sable.nicolasboyer.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sable.nicolasboyer.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = sable.nicolasboyer.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name sable.nicolasboyer.com;
    return 404; # managed by Certbot


}